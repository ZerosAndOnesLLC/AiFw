name: Build FreeBSD ISO

# Runs when a GitHub release is published:
#   gh release create v5.32.7 --prerelease --generate-notes
# The gate (FreeBSD functional suite) must pass before anything is built;
# the built ISO/IMG/update assets are then uploaded into that release.
# Re-run for an existing release with workflow_dispatch and its tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and upload to (e.g. v5.32.7)'
        required: true
      freebsd_version:
        description: >-
          FreeBSD release to build on (default 15.1). Set to an older
          release to cut a transitional build installable on appliances
          that have not upgraded their OS yet (#612).
        required: false
        default: '15.1'

permissions:
  contents: write
  id-token: write
  attestations: write

# One run per tag; never cancel a release build part-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  FREEBSD_VERSION: ${{ inputs.freebsd_version || '15.1' }}

jobs:
  # Field appliances auto-pull /releases/latest, which skips pre-releases.
  # Mark the release pre-release first thing, so a release created without
  # --prerelease can't become "latest" before it is tested and has assets.
  # Promote after testing with: gh release edit <tag> --prerelease=false --latest
  prerelease:
    name: Keep release pre-release
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease

  # Release gate (#533 Phase 1): real pfctl + real packets in a FreeBSD VM.
  # The harness itself lives in freebsd/tests/ and runs identically by hand
  # on a test VM. If it fails, nothing is built or published.
  gate:
    name: Gate - pf data-plane tests (FreeBSD VM)
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Run harness in FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          usesh: true
          copyback: true
          prepare: |
            pkg install -y curl jq sudo wireguard-tools
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            . "$HOME/.cargo/env"
          run: |
            set -e
            . "$HOME/.cargo/env"
            cd /home/runner/work/AiFw/AiFw
            echo "=== Building every binary (debug) ==="
            # All default-member binaries, not just the two the harness
            # runs: aifw-setup / aifw-cli / aifw-tui / aifw-ids carry
            # `#[cfg(target_os = "freebsd")]` code that the Linux lint job
            # never compiles — this is the only place it gets type-checked
            # before a release build (v5.115.0 shipped a setup split with
            # imports missing only inside those blocks).
            cargo build
            echo "=== Running functional harness ==="
            mkdir -p func-artifacts
            # Do NOT let a harness failure fail this step: vmactions only
            # copies the working tree back to the runner (copyback) when
            # the step succeeds, so a failing run used to upload nothing and
            # the per-test logs died with the VM. Record the exit code and
            # let the next step fail the job after the artifacts are out.
            rc=0
            sh freebsd/tests/run-all.sh --artifacts "$(pwd)/func-artifacts" || rc=$?
            echo "$rc" > func-artifacts/EXIT_CODE
            echo "=== harness exit code: $rc ==="

      - name: Harness result
        if: always()
        run: |
          rc=$(cat func-artifacts/EXIT_CODE 2>/dev/null || echo 99)
          if [ "$rc" != "0" ]; then
            echo "::error::functional harness failed (exit $rc)"
            # Surface every failing test's log inline so a red run is
            # readable without downloading the artifact.
            for f in func-artifacts/t*.log; do
              [ -f "$f" ] || continue
              if grep -q '^.*FAIL' "$f"; then
                echo "::group::$(basename "$f")"
                cat "$f"
                echo "::endgroup::"
              fi
            done
            for f in func-artifacts/aifw-api.log func-artifacts/aifw-daemon.log; do
              [ -f "$f" ] || continue
              echo "::group::$(basename "$f") (tail)"
              tail -n 80 "$f"
              echo "::endgroup::"
            done
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freebsd-functional-artifacts
          path: func-artifacts/
          retention-days: 7

  build-ui:
    name: Build Web UI (static export)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: aifw-ui/package-lock.json

      - name: Install dependencies
        working-directory: aifw-ui
        run: npm ci

      - name: Build static export
        working-directory: aifw-ui
        run: npm run build

      # Same pre-compression build-local.sh does (#203): tower_http serves
      # .br/.gz siblings; without this CI-built appliances shipped raw JS.
      - name: Pre-compress UI assets
        run: |
          sudo apt-get install -y brotli
          PROJECT_ROOT="$GITHUB_WORKSPACE"
          . freebsd/lib-build.sh
          aifw_precompress_ui aifw-ui/out

      - name: Upload UI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-export
          path: aifw-ui/out/
          retention-days: 1

  build-iso:
    name: Build FreeBSD ISO (amd64)
    needs: build-ui
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Download UI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-export
          path: freebsd/ui-export

      - name: Extract version from tag
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "${{ env.FREEBSD_VERSION }}"
          usesh: true
          copyback: true
          prepare: |
            # Install build tools (same set build-local.sh installs, minus
            # node — the UI is built on the Linux job)
            pkg install -y curl gmake jq

            # Install Rust via rustup
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            . "$HOME/.cargo/env"

          run: |
            set -e
            . "$HOME/.cargo/env"

            cd /home/runner/work/AiFw/AiFw
            # Shared build steps — the same functions build-local.sh /
            # build-update.sh run, so CI cannot drift from a local build (#203).
            PROJECT_ROOT="$(pwd)"
            . freebsd/lib-build.sh
            VERSION="${{ steps.version.outputs.version }}"

            echo "=== Building AiFw binaries ==="
            cargo build --release
            aifw_verify_binary_version "$VERSION"

            echo "=== Validating sudoers content (visudo -cf, #204) ==="
            # Pipe the same content aifw-setup writes to
            # /usr/local/etc/sudoers.d/aifw through FreeBSD's visudo
            # syntax checker. Fails the build if a malformed grant
            # would land on appliances.
            target/release/aifw-setup --print-sudoers > /tmp/aifw-sudoers
            visudo -cf /tmp/aifw-sudoers
            echo "sudoers OK"

            echo "=== Installing companion services from crates.io (#651) ==="
            COMPANIONS_ROOT="/tmp/companions"
            aifw_install_companions "$COMPANIONS_ROOT"

            echo "=== Preparing build inputs ==="
            aifw_stage_binaries freebsd/release "$COMPANIONS_ROOT/bin"

            echo "=== Recording component versions (#538/#651) ==="
            mkdir -p /usr/obj/aifw-iso/output
            aifw_write_components_json "$VERSION" "/usr/obj/aifw-iso/output/aifw-components-${VERSION}.json"
            cat "/usr/obj/aifw-iso/output/aifw-components-${VERSION}.json"

            echo "=== Building update tarball ==="
            aifw_build_update_tarball "$VERSION" "$COMPANIONS_ROOT/bin" freebsd/ui-export /usr/obj/aifw-iso/output

            echo "=== Building ISO + IMG ==="
            cd freebsd
            sh build-iso.sh "${{ steps.version.outputs.version }}" amd64

            echo "=== Compressing ISO + IMG ==="
            cd /usr/obj/aifw-iso/output
            for f in aifw-*.iso aifw-*.img; do
              if [ -f "$f" ] && [ ! -f "${f}.xz" ]; then
                xz -T0 -9 "$f"
                sha256 "${f}.xz" > "${f}.xz.sha256"
                # build-iso.sh hashed the uncompressed file, which no
                # longer exists after xz — drop its checksum so we never
                # sign or publish a sum nobody can verify.
                rm -f "${f}.sha256"
              fi
            done
            cd /home/runner/work/AiFw/AiFw

            # Move outputs to workspace root for upload
            mkdir -p /home/runner/work/AiFw/AiFw/output
            cp /usr/obj/aifw-iso/output/* /home/runner/work/AiFw/AiFw/output/

      # Scan the SOURCE tree, not output/: the release artifacts are
      # xz-compressed images syft cannot see inside, so an SBOM of output/
      # would be an empty inventory. The source scan covers Cargo.lock and
      # aifw-ui/package-lock.json — the dependency set actually compiled
      # into this release.
      - name: Generate release CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: output/aifw-release.cdx.json
          upload-artifact: false
          # The release job uploads this SBOM with the other assets.
          upload-release-assets: false

      - name: Sign release checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY is required" >&2; exit 1; }
          sudo apt-get update
          sudo apt-get install -y minisign
          key_file="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$key_file"
          chmod 600 "$key_file"
          pubkey=freebsd/overlay/usr/local/etc/aifw/update-signing.pub
          cp "$pubkey" output/update-signing.pub
          for checksum in output/*.sha256; do
            # minisign reads the key password from stdin when there is no
            # tty; harmless if the key is passwordless.
            printf '%s\n' "${MINISIGN_PASSWORD:-}" | \
              minisign -S -s "$key_file" -m "$checksum" -x "${checksum}.minisig"
            # Verify against the COMMITTED public key immediately: catches a
            # rotated/mismatched MINISIGN_SECRET_KEY before anything ships,
            # since appliances verify with the key compiled from this file.
            minisign -Vm "$checksum" -x "${checksum}.minisig" -p "$pubkey"
          done

      - name: Upload ISO artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aifw-iso-amd64
          path: output/aifw-*.iso.xz
          retention-days: 5

      - name: Upload IMG artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aifw-img-amd64
          path: output/aifw-*.img.xz
          retention-days: 5

      - name: Upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: output/*.sha256
          retention-days: 5

      - name: Upload component manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: components
          path: output/aifw-components-*.json
          retention-days: 5

      - name: Upload SBOMs and signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain
          path: |
            output/*.cdx.json
            output/*.minisig
            output/update-signing.pub
          retention-days: 5

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            output/aifw-*.iso.xz
            output/aifw-*.img.xz
            output/aifw-update-*.tar.xz
            output/aifw-release.cdx.json

  smoke-boot:
    name: Appliance boot smoke (qemu)
    needs: build-iso
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Download IMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aifw-img-amd64
          path: smoke/

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install qemu
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 genisoimage jq

      - name: Boot the image (#533 Phase 2)
        run: |
          set -e
          xz -d smoke/aifw-*.img.xz
          IMG=$(ls smoke/aifw-*.img)
          sh freebsd/tests/smoke-boot.sh --img "$IMG" --artifacts smoke-artifacts --timeout 600

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-smoke-artifacts
          path: smoke-artifacts/
          retention-days: 7

  release:
    name: Upload to GitHub Release
    # smoke-boot gates the release: an image nobody booted never ships (#533).
    needs: [build-iso, smoke-boot]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Download ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aifw-iso-amd64
          path: release-assets/

      - name: Download IMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aifw-img-amd64
          path: release-assets/

      - name: Download checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: release-assets/

      - name: Download component manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: components
          path: release-assets/

      - name: Download supply-chain assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: supply-chain
          path: release-assets/

      - name: Verify signatures before publication
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          # The committed key from checkout — the same file compiled into
          # the appliance updater — not a copy that traveled with the
          # artifacts being verified.
          pubkey=freebsd/overlay/usr/local/etc/aifw/update-signing.pub
          for checksum in release-assets/*.sha256; do
            minisign -Vm "$checksum" -x "${checksum}.minisig" -p "$pubkey"
          done

      - name: Extract version from tag
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The release already exists (gh release create made it and the tag).
      # Title it, keep it pre-release, put the download/verify notes above the
      # generated notes, and upload the assets into it.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          generated=$(gh release view "$TAG" --json body --jq .body)
          # Quoted heredoc: the notes contain backticks, so nothing may be
          # expanded by the shell; envsubst fills in only the named variables.
          envsubst '${VERSION} ${FREEBSD_VERSION} ${GITHUB_REPOSITORY}' > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## AiFw v${VERSION}

          AI-Powered Firewall for FreeBSD ${FREEBSD_VERSION}

          Requires-OS: FreeBSD ${FREEBSD_VERSION}

          ### Downloads

          | File | Description |
          |------|-------------|
          | `aifw-${VERSION}-amd64.iso.xz` | Bootable ISO (CD/DVD, VM) — xz compressed |
          | `aifw-${VERSION}-amd64.img.xz` | USB flash drive image — xz compressed |

          ### Quick Start

          1. Boot from the ISO or write the IMG to a USB drive (`dd if=aifw-*.img of=/dev/sdX bs=1M`)
          2. The setup wizard starts automatically on first boot
          3. Follow the prompts to configure networking, admin account, and firewall policy
          4. Use menu option **14** to install to disk (ZFS or UFS)

          ### Verify Downloads

          ```bash
          minisign -Vm aifw-${VERSION}-amd64.iso.xz.sha256 \
            -x aifw-${VERSION}-amd64.iso.xz.sha256.minisig \
            -p update-signing.pub
          sha256sum -c aifw-${VERSION}-amd64.iso.xz.sha256
          ```

          GitHub build provenance can also be verified with:

          ```bash
          gh attestation verify aifw-${VERSION}-amd64.iso.xz \
            --repo ${GITHUB_REPOSITORY}
          ```
          EOF
          printf '\n%s\n' "$generated" >> "$RUNNER_TEMP/notes.md"
          # ALWAYS pre-release: field appliances auto-pull /releases/latest,
          # which skips pre-releases. Promote after testing with:
          #   gh release edit <tag> --prerelease=false --latest
          gh release edit "$TAG" \
            --title "AiFw v${VERSION}" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" release-assets/* --clobber
