[package]
name = "aifw-ids-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aifw-ids"
path = "src/main.rs"

[dependencies]
mimalloc = { workspace = true, optional = true }
console-subscriber = { workspace = true, optional = true }
aifw-common = { workspace = true }
aifw-ids = { workspace = true }
aifw-ids-ipc = { workspace = true }
aifw-pf = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
sqlx = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true

[features]
default = ["mimalloc"]
# tokio-console needs `RUSTFLAGS="--cfg tokio_unstable"` at build time (#413).
tokio-console = ["dep:console-subscriber"]
