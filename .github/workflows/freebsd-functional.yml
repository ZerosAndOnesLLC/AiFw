name: FreeBSD functional tests

# #533 Phase 1: real pfctl + real packets in a FreeBSD VM on every PR that
# touches data-plane code. The harness itself lives in freebsd/tests/ and
# runs identically by hand on a test VM.

on:
  pull_request:
    paths:
      - 'aifw-pf/**'
      - 'aifw-core/**'
      - 'aifw-common/**'
      - 'aifw-api/**'
      - 'aifw-daemon/**'
      - 'freebsd/tests/**'
      - '.github/workflows/freebsd-functional.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    name: pf data-plane tests (FreeBSD VM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run harness in FreeBSD VM
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        with:
          release: "15.1"
          usesh: true
          copyback: true
          prepare: |
            pkg install -y curl jq sudo wireguard-tools
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            . "$HOME/.cargo/env"
          run: |
            set -e
            . "$HOME/.cargo/env"
            cd /home/runner/work/AiFw/AiFw
            echo "=== Building test binaries (debug) ==="
            cargo build -p aifw-api -p aifw-daemon
            echo "=== Running functional harness ==="
            mkdir -p func-artifacts
            # Do NOT let a harness failure fail this step: vmactions only
            # copies the working tree back to the runner (copyback) when
            # the step succeeds, so a failing run used to upload nothing and
            # the per-test logs died with the VM. Record the exit code and
            # let the next step fail the job after the artifacts are out.
            rc=0
            sh freebsd/tests/run-all.sh --artifacts "$(pwd)/func-artifacts" || rc=$?
            echo "$rc" > func-artifacts/EXIT_CODE
            echo "=== harness exit code: $rc ==="

      - name: Harness result
        if: always()
        run: |
          rc=$(cat func-artifacts/EXIT_CODE 2>/dev/null || echo 99)
          if [ "$rc" != "0" ]; then
            echo "::error::functional harness failed (exit $rc)"
            # Surface every failing test's log inline so a red run is
            # readable without downloading the artifact.
            for f in func-artifacts/t*.log; do
              [ -f "$f" ] || continue
              if grep -q '^.*FAIL' "$f"; then
                echo "::group::$(basename "$f")"
                cat "$f"
                echo "::endgroup::"
              fi
            done
            for f in func-artifacts/aifw-api.log func-artifacts/aifw-daemon.log; do
              [ -f "$f" ] || continue
              echo "::group::$(basename "$f") (tail)"
              tail -n 80 "$f"
              echo "::endgroup::"
            done
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freebsd-functional-artifacts
          path: func-artifacts/
          retention-days: 7
