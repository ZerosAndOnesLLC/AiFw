name: Build FreeBSD ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 5.32.7)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FREEBSD_VERSION: "15.0"

jobs:
  build-ui:
    name: Build Web UI (static export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: aifw-ui/package-lock.json

      - name: Install dependencies
        working-directory: aifw-ui
        run: npm ci

      - name: Build static export
        working-directory: aifw-ui
        run: npm run build

      - name: Upload UI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-export
          path: aifw-ui/out/
          retention-days: 1

  build-iso:
    name: Build FreeBSD ISO (amd64)
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download UI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-export
          path: freebsd/ui-export

      - name: Extract version from tag
        id: version
        run: if [ -n "${{ inputs.version }}" ]; then
              echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            else
              echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            fi

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        with:
          release: "${{ env.FREEBSD_VERSION }}"
          usesh: true
          copyback: true
          prepare: |
            # Install build tools
            pkg install -y curl gmake

            # Install Rust via rustup
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            . "$HOME/.cargo/env"

          run: |
            set -e
            . "$HOME/.cargo/env"

            echo "=== Building AiFw binaries ==="
            cd /home/runner/work/AiFw/AiFw
            cargo build --release

            echo "=== Validating sudoers content (visudo -cf, #204) ==="
            # Pipe the same content aifw-setup writes to
            # /usr/local/etc/sudoers.d/aifw through FreeBSD's visudo
            # syntax checker. Fails the build if a malformed grant
            # would land on appliances.
            target/release/aifw-setup --print-sudoers > /tmp/aifw-sudoers
            visudo -cf /tmp/aifw-sudoers
            echo "sudoers OK"

            # Build external repos from manifest, pinned to the reviewed
            # commit recorded there (#538). An unpinned or unresolvable
            # revision fails the build — never fall back to branch HEAD.
            MANIFEST="freebsd/manifest.json"
            for row in $(jq -c '.external_repos[]' "$MANIFEST"); do
              NAME=$(echo "$row" | jq -r '.name')
              REPO=$(echo "$row" | jq -r '.repo')
              COMMIT=$(echo "$row" | jq -r '.commit // empty')
              if [ -z "$COMMIT" ]; then
                echo "ERROR: ${NAME} has no pinned commit in ${MANIFEST} (#538)" >&2
                exit 1
              fi
              echo "=== Building $NAME @ $COMMIT ==="
              git clone "https://github.com/${REPO}.git" "/tmp/${NAME}"
              git -C "/tmp/${NAME}" checkout --detach "$COMMIT" || {
                echo "ERROR: pinned commit ${COMMIT} not found in ${REPO}" >&2
                exit 1
              }
              ACTUAL=$(git -C "/tmp/${NAME}" rev-parse HEAD)
              if [ "$ACTUAL" != "$COMMIT" ]; then
                echo "ERROR: ${NAME} checked out ${ACTUAL}, expected ${COMMIT}" >&2
                exit 1
              fi
              cd "/tmp/${NAME}"
              cargo build --release
              cd /home/runner/work/AiFw/AiFw
            done

            echo "=== Preparing build inputs ==="
            mkdir -p freebsd/release
            # Copy local binaries
            for bin in $(jq -r '.binaries.local[]' "$MANIFEST"); do
              cp "target/release/${bin}" "freebsd/release/${bin}"
            done
            # Copy external binaries
            for row in $(jq -c '.external_repos[]' "$MANIFEST"); do
              NAME=$(echo "$row" | jq -r '.name')
              for bin in $(echo "$row" | jq -r '.binaries[]'); do
                [ -f "/tmp/${NAME}/target/release/${bin}" ] && cp "/tmp/${NAME}/target/release/${bin}" "freebsd/release/${bin}"
              done
            done

            echo "=== Recording component revisions (#538) ==="
            # Machine-readable record of the exact source that produced this
            # artifact set: AiFw commit + every pinned companion commit.
            # Ships as a release asset and inside the update tarball.
            VERSION="${{ steps.version.outputs.version }}"
            jq -n \
              --arg version "$VERSION" \
              --arg aifw_commit "${{ github.sha }}" \
              --slurpfile manifest "$MANIFEST" \
              '{version: $version, aifw_commit: $aifw_commit,
                components: [$manifest[0].external_repos[] | {name, repo, commit}]}' \
              > /tmp/aifw-components.json
            cat /tmp/aifw-components.json
            mkdir -p /usr/obj/aifw-iso/output
            cp /tmp/aifw-components.json "/usr/obj/aifw-iso/output/aifw-components-${VERSION}.json"

            echo "=== Building update tarball ==="
            TARBALL_DIR="/tmp/aifw-update-${VERSION}-amd64"
            mkdir -p "$TARBALL_DIR/bin" "$TARBALL_DIR/ui" "$TARBALL_DIR/rc.d" "$TARBALL_DIR/sbin" "$TARBALL_DIR/libexec"
            # Copy all binaries from freebsd/release/ into tarball
            for bin in freebsd/release/*; do
              [ -f "$bin" ] && cp "$bin" "$TARBALL_DIR/bin/"
            done
            cp -a freebsd/ui-export/* "$TARBALL_DIR/ui/"
            cp -a freebsd/overlay/usr/local/etc/rc.d/* "$TARBALL_DIR/rc.d/"
            cp -a freebsd/overlay/usr/local/sbin/* "$TARBALL_DIR/sbin/"
            # libexec scripts (restart driver, watchdog, narrow-grant sudo
            # helpers). The updater iterates <tarball>/libexec/ on install —
            # without this, CI-built tarballs never ship helper updates (#469).
            cp -a freebsd/overlay/usr/local/libexec/* "$TARBALL_DIR/libexec/"
            chmod 755 "$TARBALL_DIR"/rc.d/* "$TARBALL_DIR"/sbin/* "$TARBALL_DIR"/libexec/*
            echo "$VERSION" > "$TARBALL_DIR/version"
            cp /tmp/aifw-components.json "$TARBALL_DIR/components.json"
            tar -C /tmp -cJf "/usr/obj/aifw-iso/output/aifw-update-${VERSION}-amd64.tar.xz" "aifw-update-${VERSION}-amd64"
            cd /usr/obj/aifw-iso/output
            sha256 "aifw-update-${VERSION}-amd64.tar.xz" > "aifw-update-${VERSION}-amd64.tar.xz.sha256"
            rm -rf "$TARBALL_DIR"
            cd /home/runner/work/AiFw/AiFw

            echo "=== Building ISO + IMG ==="
            cd freebsd
            sh build-iso.sh "${{ steps.version.outputs.version }}" amd64

            echo "=== Compressing ISO + IMG ==="
            cd /usr/obj/aifw-iso/output
            for f in aifw-*.iso aifw-*.img; do
              if [ -f "$f" ] && [ ! -f "${f}.xz" ]; then
                xz -T0 -9 "$f"
                sha256 "${f}.xz" > "${f}.xz.sha256"
                # build-iso.sh hashed the uncompressed file, which no
                # longer exists after xz — drop its checksum so we never
                # sign or publish a sum nobody can verify.
                rm -f "${f}.sha256"
              fi
            done
            cd /home/runner/work/AiFw/AiFw

            # Move outputs to workspace root for upload
            mkdir -p /home/runner/work/AiFw/AiFw/output
            cp /usr/obj/aifw-iso/output/* /home/runner/work/AiFw/AiFw/output/

      # Scan the SOURCE tree, not output/: the release artifacts are
      # xz-compressed images syft cannot see inside, so an SBOM of output/
      # would be an empty inventory. The source scan covers Cargo.lock and
      # aifw-ui/package-lock.json — the dependency set actually compiled
      # into this release.
      - name: Generate release CycloneDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          path: .
          format: cyclonedx-json
          output-file: output/aifw-release.cdx.json
          upload-artifact: false

      - name: Sign release checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY is required" >&2; exit 1; }
          sudo apt-get update
          sudo apt-get install -y minisign
          key_file="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$key_file"
          chmod 600 "$key_file"
          pubkey=freebsd/overlay/usr/local/etc/aifw/update-signing.pub
          cp "$pubkey" output/update-signing.pub
          for checksum in output/*.sha256; do
            # minisign reads the key password from stdin when there is no
            # tty; harmless if the key is passwordless.
            printf '%s\n' "${MINISIGN_PASSWORD:-}" | \
              minisign -S -s "$key_file" -m "$checksum" -x "${checksum}.minisig"
            # Verify against the COMMITTED public key immediately: catches a
            # rotated/mismatched MINISIGN_SECRET_KEY before anything ships,
            # since appliances verify with the key compiled from this file.
            minisign -Vm "$checksum" -x "${checksum}.minisig" -p "$pubkey"
          done

      - name: Upload ISO artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aifw-iso-amd64
          path: output/aifw-*.iso.xz
          retention-days: 5

      - name: Upload IMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aifw-img-amd64
          path: output/aifw-*.img.xz
          retention-days: 5

      - name: Upload checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checksums
          path: output/*.sha256
          retention-days: 5

      - name: Upload component manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: components
          path: output/aifw-components-*.json
          retention-days: 5

      - name: Upload SBOMs and signatures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain
          path: |
            output/*.cdx.json
            output/*.minisig
            output/update-signing.pub
          retention-days: 5

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            output/aifw-*.iso.xz
            output/aifw-*.img.xz
            output/aifw-update-*.tar.xz
            output/aifw-release.cdx.json

  smoke-boot:
    name: Appliance boot smoke (qemu)
    needs: build-iso
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download IMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aifw-img-amd64
          path: smoke/

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install qemu
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 genisoimage jq

      - name: Boot the image (#533 Phase 2)
        run: |
          set -e
          xz -d smoke/aifw-*.img.xz
          IMG=$(ls smoke/aifw-*.img)
          sh freebsd/tests/smoke-boot.sh --img "$IMG" --artifacts smoke-artifacts --timeout 600

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boot-smoke-artifacts
          path: smoke-artifacts/
          retention-days: 7
  release:
    name: Create GitHub Release
    # smoke-boot gates the release: an image nobody booted never ships (#533).
    needs: [build-iso, smoke-boot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download ISO
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aifw-iso-amd64
          path: release-assets/

      - name: Download IMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aifw-img-amd64
          path: release-assets/

      - name: Download checksums
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checksums
          path: release-assets/

      - name: Download component manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: components
          path: release-assets/

      - name: Download supply-chain assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: supply-chain
          path: release-assets/

      - name: Verify signatures before publication
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          # The committed key from checkout — the same file compiled into
          # the appliance updater — not a copy that traveled with the
          # artifacts being verified.
          pubkey=freebsd/overlay/usr/local/etc/aifw/update-signing.pub
          for checksum in release-assets/*.sha256; do
            minisign -Vm "$checksum" -x "${checksum}.minisig" -p "$pubkey"
          done

      - name: Extract version from tag
        id: version
        run: if [ -n "${{ inputs.version }}" ]; then
              echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            else
              echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            fi

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: "AiFw v${{ steps.version.outputs.version }}"
          draft: false
          # ALWAYS pre-release: field appliances auto-pull /releases/latest,
          # which skips pre-releases. A plain v* tag used to publish stable
          # instantly — an untested build every appliance would grab the
          # moment CI finished. Promote after testing with:
          #   gh release edit <tag> --prerelease=false --latest
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/*
          body: |
            ## AiFw v${{ steps.version.outputs.version }}

            AI-Powered Firewall for FreeBSD ${{ env.FREEBSD_VERSION }}

            ### Downloads

            | File | Description |
            |------|-------------|
            | `aifw-${{ steps.version.outputs.version }}-amd64.iso.xz` | Bootable ISO (CD/DVD, VM) — xz compressed |
            | `aifw-${{ steps.version.outputs.version }}-amd64.img.xz` | USB flash drive image — xz compressed |

            ### Quick Start

            1. Boot from the ISO or write the IMG to a USB drive (`dd if=aifw-*.img of=/dev/sdX bs=1M`)
            2. The setup wizard starts automatically on first boot
            3. Follow the prompts to configure networking, admin account, and firewall policy
            4. Use menu option **14** to install to disk (ZFS or UFS)

            ### Verify Downloads

            ```bash
            minisign -Vm aifw-${{ steps.version.outputs.version }}-amd64.iso.xz.sha256 \
              -x aifw-${{ steps.version.outputs.version }}-amd64.iso.xz.sha256.minisig \
              -p update-signing.pub
            sha256sum -c aifw-${{ steps.version.outputs.version }}-amd64.iso.xz.sha256
            ```

            GitHub build provenance can also be verified with:

            ```bash
            gh attestation verify aifw-${{ steps.version.outputs.version }}-amd64.iso.xz \
              --repo ${{ github.repository }}
            ```
