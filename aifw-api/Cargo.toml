[package]
name = "aifw-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aifw-api"
path = "src/main.rs"

[dependencies]
aifw-common = { workspace = true }
aifw-pf = { workspace = true }
aifw-core = { workspace = true }
aifw-conntrack = { workspace = true }
aifw-plugins = { workspace = true }
aifw-ids = { workspace = true }
aifw-ids-ipc = { workspace = true }
aifw-metrics = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
dashmap = "6"
nix = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
async-stream = "0.3"
futures-util = "0.3"
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
clap = { workspace = true, features = ["env"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = { workspace = true }
serde_yaml_ng = "0.10"
time = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
quick-xml = "0.40"
thiserror = { workspace = true }

[dev-dependencies]
axum-test = "20"

[lints]
workspace = true
