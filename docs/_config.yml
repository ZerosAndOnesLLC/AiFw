title: AiFw
tagline: AI-Powered Open-Source Firewall
description: Modern open-source firewall for FreeBSD built in Rust. Alternative to pfSense and OPNsense with WireGuard, IDS/IPS, AI threat detection, and a modern web UI.
url: https://aifw.zerosandones.us
baseurl: ""

# Search engine verification — paste the content value from the meta tag.
# Leave commented out until you have real codes; empty strings render empty meta tags.
# Google: Search Console -> Settings -> Ownership verification -> HTML tag
# Bing:   Webmaster Tools -> Site -> Configure -> Verify ownership -> Meta tag
# google_site_verification: "abc123..."
# bing_site_verification: "abc123..."

google_analytics: "G-XDP7MDXR78"
repository: ZerosAndOnesLLC/AiFw

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# SEO
twitter:
  card: summary_large_image
  username: ZerosAndOnesLLC
logo: /assets/AiFw-1.png
social:
  name: ZerosAndOnesLLC
  type: Organization
  links:
    - https://github.com/ZerosAndOnesLLC/AiFw
    - https://github.com/ZerosAndOnesLLC

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/AiFw-1.png

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - superpowers

markdown: kramdown
kramdown:
  syntax_highlighter: rouge

# Top nav definition — referenced by _layouts/default.html
nav:
  primary:
    - title: Features
      url: /features/
    - title: Docs
      dropdown:
        - { title: "Install",        url: "/install/" }
        - { title: "First boot",     url: "/install/#first-boot-setup-wizard" }
        - { divider: true }
        - { title: "Firewall",       url: "/docs/firewall/" }
        - { title: "NAT",            url: "/docs/nat/" }
        - { title: "VPN",            url: "/docs/vpn/" }
        - { title: "IDS / IPS",      url: "/docs/ids/" }
        - { title: "Multi-WAN",      url: "/multi-wan/" }
        - { title: "HA cluster",     url: "/ha/" }
        - { title: "DNS",            url: "/docs/dns/" }
        - { title: "DHCP",           url: "/docs/dhcp/" }
        - { title: "Geo-IP",         url: "/docs/geoip/" }
        - { title: "Auth & RBAC",    url: "/docs/auth/" }
        - { title: "Reverse proxy",  url: "/docs/reverse-proxy/" }
        - { title: "Backup & migration", url: "/docs/backup/" }
        - { title: "Plugins",        url: "/plugins/" }
        - { divider: true }
        - { title: "API reference", url: "/docs/api/" }
        - { title: "CLI reference", url: "/docs/cli/" }
        - { title: "FAQ",           url: "/faq/" }
    - title: Compare
      url: /compare/
    - title: Download
      url: https://github.com/ZerosAndOnesLLC/AiFw/releases/latest
      external: true
    - title: GitHub
      url: https://github.com/ZerosAndOnesLLC/AiFw
      external: true
