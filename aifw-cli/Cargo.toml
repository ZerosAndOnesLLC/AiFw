[package]
name = "aifw-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "aifw_cli"
path = "src/lib.rs"

[[bin]]
name = "aifw"
path = "src/main.rs"

[dependencies]
aifw-common = { workspace = true }
aifw-client = { workspace = true }
aifw-core = { workspace = true }
aifw-plugins = { workspace = true }
aifw-pf = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "process"] }
clap = { workspace = true, features = ["env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, features = ["multipart", "stream"] }
serde_yaml_ng = "0.10"
uuid = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
nix = { workspace = true }
toml = "0.9"
comfy-table = { version = "7", default-features = false }
rpassword = "7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[lints]
workspace = true
