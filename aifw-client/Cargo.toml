[package]
name = "aifw-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed async client for the AiFw REST API (used by the aifw CLI) plus the shared TLS pinning"

[dependencies]
reqwest = { workspace = true, features = ["multipart", "stream"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
url = { workspace = true }
webpki-roots = "1"
chrono = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
rcgen = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-rustls = { workspace = true }
axum = { workspace = true }

[lints]
workspace = true
